# Builds a signed APK for every version tag (e.g. v1.1.0) and attaches it to a GitHub release.
# Required repository secrets (see README):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android-Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Keystore bereitstellen
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt (siehe README)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # Builds the current timetable from eva2 into the APK; if that fails, the one in the repository is used.
      - name: Stundenplan von eva2 laden
        run: |
          ./gradlew :schedule:jvmRun --args="$PWD/schedule/schedules.json" \
            || echo "::warning::Stundenplan-Export fehlgeschlagen, verwende schedule/schedules.json aus dem Repository."

      - name: APK bauen
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew :androidApp:assembleRelease
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "Stundenplan-${GITHUB_REF_NAME}.apk"

      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Stundenplan-${GITHUB_REF_NAME}.apk" \
            --title "Stundenplan $GITHUB_REF_NAME" \
            --notes "Android: APK herunterladen und installieren. iPhone: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/ in Safari öffnen → Teilen → Zum Home-Bildschirm."
