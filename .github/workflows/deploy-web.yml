# Builds the web version (PWA) and publishes it on GitHub Pages, together with the current
# Mensa menu as mensa.json (the browser may not load the Studierendenwerk website directly).
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Web-App deployen

on:
  push:
    branches: [main]
  schedule:
    # UTC: Mon–Sat 04–16 every 3 hours (06–18 German summer time) and daily around midnight.
    - cron: '0 4-16/3 * * 1-6'
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - id: pages
        uses: actions/configure-pages@v6

      - name: Web-App bauen
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      # If the website changed and the export fails, keep the previously published menu.
      - name: Mensa-Speiseplan exportieren
        env:
          OUT: webApp/build/dist/wasmJs/productionExecutable/mensa.json
        run: |
          if ! ./gradlew :mensa:jvmRun --args="$PWD/$OUT"; then
            echo "::warning::Mensa-Export fehlgeschlagen, verwende bisherige mensa.json."
            curl -fsS "${{ steps.pages.outputs.base_url }}/mensa.json" -o "$OUT" || true
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
