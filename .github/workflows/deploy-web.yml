# Builds the web version (PWA) and publishes it on GitHub Pages, together with the current
# Mensa menu as mensa.json and the timetables from eva2 as schedules.json (the browser may not
# load those websites directly; the apps load these files instead). schedule.json keeps the old
# format for Android apps up to v1.4.0.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Web-App deployen

on:
  push:
    branches: [main]
  schedule:
    # UTC: Mon–Sat 04–16 every 3 hours (06–18 German summer time) and daily around midnight.
    - cron: '0 4-16/3 * * 1-6'
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - id: pages
        uses: actions/configure-pages@v6

      # Updates the built-in timetable (schedule/schedules.json) before the web app is built.
      - name: Stundenplan von eva2 laden
        id: schedule
        continue-on-error: true
        run: ./gradlew :schedule:jvmRun --args="$PWD/schedule/schedules.json $RUNNER_TEMP/schedule.json"

      - name: Web-App bauen
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      # If eva2 changed and the export failed, keep the previously published timetables.
      - name: Stundenplan veröffentlichen
        env:
          OUT: webApp/build/dist/wasmJs/productionExecutable
        run: |
          if [ "${{ steps.schedule.outcome }}" = "success" ]; then
            cp schedule/schedules.json "$OUT/schedules.json"
            cp "$RUNNER_TEMP/schedule.json" "$OUT/schedule.json"
          else
            echo "::warning::Stundenplan-Export fehlgeschlagen, verwende bisherige schedules.json/schedule.json."
            curl -fsS "${{ steps.pages.outputs.base_url }}/schedules.json" -o "$OUT/schedules.json" \
              || cp schedule/schedules.json "$OUT/schedules.json"
            curl -fsS "${{ steps.pages.outputs.base_url }}/schedule.json" -o "$OUT/schedule.json" || true
          fi

      # If the website changed and the export fails, keep the previously published menu.
      - name: Mensa-Speiseplan exportieren
        env:
          OUT: webApp/build/dist/wasmJs/productionExecutable/mensa.json
        run: |
          if ! ./gradlew :mensa:jvmRun --args="$PWD/$OUT"; then
            echo "::warning::Mensa-Export fehlgeschlagen, verwende bisherige mensa.json."
            curl -fsS "${{ steps.pages.outputs.base_url }}/mensa.json" -o "$OUT" || true
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
