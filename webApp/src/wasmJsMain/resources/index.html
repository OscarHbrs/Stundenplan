<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Stundenplan</title>
    <meta name="description" content="Stundenplan für Erstis an der H-BRS (BCSP, BI, BWI)">

    <!-- PWA / Home-Bildschirm -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Stundenplan">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1E1E1E">

    <style>
        :root {
            --bg: #FFFFFF;
            --fg: #1C1B1F;
            --muted: #6B6B6B;
            --primary: #00695C;
            color-scheme: light dark;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1E1E1E;
                --fg: #E6E1E5;
                --muted: #A0A0A0;
                --primary: #4DB6AC;
            }
        }
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
        }
        #app {
            position: fixed;
            inset: 0;
            touch-action: manipulation;
        }
        /* Compose reads env(safe-area-inset-*) through this element (see Main.kt). */
        #safe-area-probe {
            position: fixed;
            visibility: hidden;
            pointer-events: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                     env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: var(--bg);
            z-index: 10;
        }
        #loading .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid color-mix(in srgb, var(--primary) 25%, transparent);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        #loading p {
            margin: 0;
            font-size: 14px;
            color: var(--muted);
            text-align: center;
            padding: 0 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="safe-area-probe"></div>
    <div id="loading">
        <div class="spinner"></div>
        <p id="loading-text">Stundenplan wird geladen …</p>
    </div>
    <div id="app"></div>

    <script>
        // Compose for Web needs WebAssembly GC (Safari 18.2+, Chrome 119+, Firefox 120+).
        const wasmGcSupported = (() => {
            try {
                // Minimal module declaring a GC struct type.
                return WebAssembly.validate(new Uint8Array([
                    0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0
                ]));
            } catch (e) {
                return false;
            }
        })();

        if (!wasmGcSupported) {
            document.querySelector('#loading .spinner').remove();
            document.getElementById('loading-text').textContent =
                'Dein Browser ist zu alt für diese App. Bitte aktualisiere iOS auf 18.2 oder neuer ' +
                'bzw. verwende einen aktuellen Browser.';
        } else {
            const script = document.createElement('script');
            script.src = 'webApp.js';
            document.body.appendChild(script);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
